name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    name: Node tests (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Audit 2.4: package.json claims >=20 and README claims Windows support —
      # the matrix verifies both claims. Failures are reported, never skipped.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run the test suite
        run: node --test tests/*.test.mjs
      - name: Verify third-party license records
        # Heavy checks need to run once, not nine times.
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: node scripts/verify-licenses.mjs
      - name: CI diagnostics
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: node scripts/diagnose-ci.mjs

  android-build:
    name: Android unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # ubuntu-latest ships a preinstalled Android SDK with licenses accepted;
      # AGP resolves it via ANDROID_HOME. Do not run setup-android — its
      # cmdline-tools step breaks on the SDK Preview license prompt.
      - name: Gradle unit tests
        working-directory: android
        run: ./gradlew testOnlineDebugUnitTest
      - name: Assemble online debug APK
        working-directory: android
        run: ./gradlew assembleOnlineDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UniversalHarness-android-debug
          path: android/app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # CodeQL writes SARIF results and comments on PRs.
      security-events: write
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, java-kotlin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          # The Android build needs a JDK; gradle autobuild handles the rest.
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: matrix.language == 'java-kotlin'
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: ${{ matrix.language }}
