name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    name: Node tests (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Audit 2.4: package.json claims >=20 and README claims Windows support —
      # the matrix verifies both claims. Failures are reported, never skipped.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run the test suite
        run: node --test tests/*.test.mjs
      - name: Verify third-party license records
        # Heavy checks need to run once, not nine times.
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: node scripts/verify-licenses.mjs
      - name: CI diagnostics
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: node scripts/diagnose-ci.mjs

  android-build:
    name: Android unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      # ubuntu-latest ships a preinstalled Android SDK with licenses accepted;
      # AGP resolves it via ANDROID_HOME. Do not run setup-android — its
      # cmdline-tools step breaks on the SDK Preview license prompt.
      - name: Gradle unit tests
        working-directory: android
        run: ./gradlew testOnlineDebugUnitTest
      - name: Assemble online debug APK
        working-directory: android
        run: ./gradlew assembleOnlineDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniversalHarness-android-debug
          path: android/app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # CodeQL writes SARIF results and comments on PRs.
      security-events: write
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, java-kotlin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: ${{ matrix.language }}
          # The Android build needs a JDK; gradle autobuild handles the rest.
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: github/codeql-action/autobuild@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        if: matrix.language == 'java-kotlin'
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          category: ${{ matrix.language }}
