name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-tests:
    name: Node tests + license verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run the test suite
        run: node --test tests/*.test.mjs
      - name: Verify third-party license records
        run: node scripts/verify-licenses.mjs
      - name: CI diagnostics
        run: node scripts/diagnose-ci.mjs

  android-build:
    name: Android unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships a preinstalled Android SDK with licenses accepted;
      # AGP resolves it via ANDROID_HOME. Do not run setup-android — its
      # cmdline-tools step breaks on the SDK Preview license prompt.
      - name: Gradle unit tests
        working-directory: android
        run: ./gradlew testOnlineDebugUnitTest
      - name: Assemble online debug APK
        working-directory: android
        run: ./gradlew assembleOnlineDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalHarness-android-debug
          path: android/app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error
